name: renovate-lockfile

on:
  pull_request:
    paths:
      - WeatherDemo.xcodeproj/project.pbxproj

permissions:
  contents: write

concurrency:
  group: renovate-lockfile-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh:
    # Renovate updates the package pins in project.pbxproj but cannot refresh the SwiftPM
    # lockfile itself. This job resolves dependencies on the Renovate branch and pushes the
    # refreshed Package.resolved back, so checks.sh's staleness gate passes.
    if: >-
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          # A fine-grained PAT (contents: read/write on this repository) stored as
          # RENOVATE_LOCKFILE_TOKEN. Pushes made with the default GITHUB_TOKEN do not trigger
          # workflows, so without the secret the refreshed commit would not get a ci run and
          # the required check would stay pending.
          token: ${{ secrets.RENOVATE_LOCKFILE_TOKEN || github.token }}
      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WeatherDemo.xcodeproj \
            -scheme WeatherDemo
      - name: Commit refreshed Package.resolved
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          lockfile="WeatherDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if git diff --quiet -- "$lockfile"; then
            echo "Package.resolved is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$lockfile"
          git commit -m "Refresh Package.resolved for Renovate update"
          git push origin "HEAD:$BRANCH"
