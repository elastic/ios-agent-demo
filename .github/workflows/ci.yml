name: ci

env:
  BACKEND_VERSION: 0.0.2

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-Markdown changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Unable to compare with the previous revision; running code checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base_sha" "$head_sha" -- . ':(exclude,glob)**/*.md'; then
            echo "Only Markdown files changed; skipping code checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "Non-Markdown files changed; running code checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint, test, and build
        run: ./checks.sh

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Elastic distributions
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .ci-cache/elastic
          key: elastic-e2e-9.4.2-${{ runner.os }}-${{ runner.arch }}
      - name: Cache backend release
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .ci-cache/backend
          key: backend-${{ env.BACKEND_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Run end-to-end telemetry test
        run: .github/scripts/e2e-test/e2e_test.sh
      - name: Store end-to-end diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results
          if-no-files-found: error
          path: |
            build/e2e/*.json
            build/e2e/*.log
            build/e2e/*.zip

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - checks
      - e2e
    steps:
      - name: Verify required jobs
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$CODE_CHANGED" = "false" ]; then
            echo "Documentation-only change; code checks were not required."
            exit 0
          fi

          if [ "$CODE_CHANGED" != "true" ] || \
             [ "$CHECKS_RESULT" != "success" ] || \
             [ "$E2E_RESULT" != "success" ]; then
            echo "Required jobs did not succeed:" >&2
            echo "  changes: $CODE_CHANGED" >&2
            echo "  checks:  $CHECKS_RESULT" >&2
            echo "  e2e:     $E2E_RESULT" >&2
            exit 1
          fi

          echo "All required code checks succeeded."
