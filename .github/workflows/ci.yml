name: ci

env:
  BACKEND_VERSION: 0.0.2

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint, test, and build
        run: ./checks.sh

  e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Elastic distributions
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .ci-cache/elastic
          key: elastic-e2e-9.4.2-${{ runner.os }}-${{ runner.arch }}
      - name: Cache backend release
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .ci-cache/backend
          key: backend-${{ env.BACKEND_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Run end-to-end telemetry test
        run: .github/scripts/e2e-test/e2e_test.sh
      - name: Store end-to-end diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results
          if-no-files-found: error
          path: |
            build/e2e/*.json
            build/e2e/*.log
            build/e2e/*.zip

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - checks
      - e2e
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@dfc49d17a918509972053000cce88c11c7c0c987 # v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}
